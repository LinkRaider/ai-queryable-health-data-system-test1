name: health-data-system

x-app: &app
  build:
    context: .
  environment: &app-environment
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    KAFKA_TOPIC: health-metrics
    KAFKA_DLQ_TOPIC: health-metrics-dlq
    POSTGRES_DSN: postgresql://health:health@postgres:5432/health
    OLLAMA_BASE_URL: http://ollama:11434
    OLLAMA_MODEL: qwen2.5:0.5b
    LOG_LEVEL: INFO
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  redpanda:
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  ollama:
    image: ollama/ollama:0.5.7
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ollama-data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:0.5.7
    command: ["pull", "qwen2.5:0.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  producer:
    <<: *app
    command: ["python", "-m", "health_data.producer"]
    environment:
      <<: *app-environment
      GENERATOR_SEED: "20261019"
      GENERATOR_USER_COUNT: "50"
      GENERATOR_HISTORY_DAYS: "7"
      GENERATOR_LIVE_INTERVAL_SECONDS: "30"
    depends_on:
      redpanda:
        condition: service_healthy

  ingestor:
    <<: *app
    command: ["python", "-m", "health_data.consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "health_data.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  ollama-data:
  postgres-data:
  redpanda-data:
