[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "health-data-system"
version = "0.1.0"
description = "Synthetic health metric streaming and query system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiokafka==0.12.0",
  "asyncpg==0.30.0",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "orjson==3.10.15",
  "prometheus-client==0.21.1",
  "pydantic-settings==2.7.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/health_data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
